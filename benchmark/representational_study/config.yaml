# Representational bias study (real datasets).
#
# Shared config for adult.ipynb and compas.ipynb. Datasets are NOT listed
# here — each notebook builds a balanced (25/25/25/25) base on its dataset
# and then writes 5 sub-sampled levels per the p_u sweep:
#
#   p_u ∈ {1.0, 0.75, 0.5, 0.25, 0.1}     fraction of unprivileged group kept
#
# Method / classifier / metric / CV blocks below mirror
# benchmark/biasondemand/config.yaml verbatim so synthetic and real-data
# representational tracks are directly comparable.

methods:
  - Baseline
  - FairSmote
  - Massaging
  - FairOversampling
  - FAWOS
  - HeterogeneousFOS
  - FairwayRemover
  - DisparateImpactRemover
  - LearningFairRepresentations
  - ReweighingClassifier
  - FairBalanceClassifier
  - FairMask

classifiers:
  - path: sklearn.linear_model.LogisticRegression
    name: LogReg
    solver: liblinear
    max_iter: 1000
    random_state: 42
  - path: sklearn.tree.DecisionTreeClassifier
    name: DecisionTree
    random_state: 42
  - path: sklearn.svm.SVC
    name: SVC
    random_state: 42
  - path: xgboost.XGBClassifier
    name: XGBoost
    eval_metric: logloss
    random_state: 42

cv:
  n_splits: 5
  random_state: 42
  stratify: both

metrics:
  # performance
  - accuracy
  - balanced_accuracy
  - precision
  - recall
  - f1_score
  # fairness
  - disparate_impact
  - spd
  - eod
  - aod
  - true_negative_rate_difference
  - predictive_equality
  - accuracy_parity
  - equal_opportunity_ratio
  - false_negative_rate_difference

audit:
  bias: true
  fairness: true

save:
  results_csv: true
  object_pkl: true
  report_html: true
  # Each per-dataset notebook overrides save_path to
  # ../outputs/representational_study/<dataset>; this is just a fallback.
  path: ../outputs/representational_study/benchmark
